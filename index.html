<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSpeed Test – Free Internet Speed Test (Download, Upload, Ping)</title>
    <meta name="description" content="Test your internet speed for free with NetSpeed. Instantly check download speed, upload speed, ping, and jitter — no signup, no ads, works on any device.">
    <meta name="keywords" content="internet speed test, network speed test, download speed, upload speed, ping test, free speed test">
    <meta name="author" content="David Ayomide">
    <link rel="canonical" href="https://d9118268-ai.github.io/netspeed-test/">

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="NetSpeed Test – Free Internet Speed Test">
    <meta property="og:description" content="Check your download, upload, ping, and jitter instantly. Free, fast, and no signup required.">
    <meta property="og:url" content="https://d9118268-ai.github.io/netspeed-test/">
    <meta property="og:image" content="https://d9118268-ai.github.io/netspeed-test/favicon.png">

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="NetSpeed Test – Free Internet Speed Test">
    <meta name="twitter:description" content="Check your download, upload, ping, and jitter instantly. Free, fast, and no signup required.">
    <meta name="twitter:image" content="https://d9118268-ai.github.io/netspeed-test/favicon.png">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ NetSpeed</h1>
            <p>Test your internet connection</p>
        </header>

        <div class="gauge-container">
            <div class="gauge">
                <div class="gauge-bg"></div>
                <div class="gauge-fill" id="gaugeFill"></div>
                <div class="gauge-center">
                    <span class="speed-value" id="speedValue">0.0</span>
                    <span class="speed-unit" id="speedUnit">Mbps</span>
                    <span class="test-label" id="testLabel">Ready</span>
                </div>
            </div>
        </div>

        <div class="results" id="results">
            <div class="result-card">
                <span class="result-icon">📥</span>
                <span class="result-label">Download</span>
                <span class="result-value" id="downloadResult">--</span>
                <span class="result-unit">Mbps</span>
            </div>
            <div class="result-card">
                <span class="result-icon">📤</span>
                <span class="result-label">Upload</span>
                <span class="result-value" id="uploadResult">--</span>
                <span class="result-unit">Mbps</span>
            </div>
            <div class="result-card">
                <span class="result-icon">⏱️</span>
                <span class="result-label">Ping</span>
                <span class="result-value" id="pingResult">--</span>
                <span class="result-unit">ms</span>
            </div>
            <div class="result-card">
                <span class="result-icon">📊</span>
                <span class="result-label">Jitter</span>
                <span class="result-value" id="jitterResult">--</span>
                <span class="result-unit">ms</span>
            </div>
        </div>

        <button class="start-btn" id="startBtn" onclick="startTest()">
            <span class="btn-text">Start Test</span>
            <div class="btn-loader" id="btnLoader"></div>
        </button>

        <div class="server-info">
            <span id="serverLocation">🌍 Detecting location...</span>
        </div>
    </div>
<footer>
  <p>
    Developed By: <strong>David Ayomide</strong> &copy;
    <span id="year"></span>
  </p>
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

    <script src="app.js"></script>
</body>
</html>
